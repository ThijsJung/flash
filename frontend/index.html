    <body>
        <!-- Screen: URL Input -->
        <div id="screen-url" class="screen active">
            <div class="container">
                <h1 class="logo">Flash</h1>
                <p class="tagline">Your decks, your way.</p>
                <div class="input-group">
                    <label for="sheet-url">Google Sheets URL</label>
                    <input
                        type="url"
                        id="sheet-url"
                        placeholder="https://docs.google.com/spreadsheets/d/..."
                        autocomplete="off"
                        spellcheck="false"
                    />
                </div>
                <button id="btn-load" class="btn btn-primary">
                    Load decks
                </button>
                <p id="url-error" class="error hidden"></p>
            </div>
        </div>

        <!-- Screen: Deck Picker -->
        <div id="screen-decks" class="screen">
            <div class="container">
                <button id="btn-back-url" class="btn-back">← Back</button>
                <h2>Choose a deck</h2>
                <div id="deck-list" class="deck-list"></div>
            </div>
        </div>

        <!-- Screen: Ready -->
        <div id="screen-ready" class="screen">
            <div class="container">
                <button id="btn-back-ready" class="btn-back">← Decks</button>
                <div class="ready-info">
                    <h2 id="ready-deck-name"></h2>
                    <p id="ready-deck-desc" class="ready-deck-desc"></p>
                </div>
                <div class="session-size-wrap">
                    <p class="session-size-label">How many cards?</p>
                    <div
                        id="session-size-options"
                        class="session-size-options"
                    ></div>
                </div>
                <div class="session-size-wrap">
                    <p class="session-size-label">Order</p>
                    <div class="session-size-options">
                        <button class="size-btn active" data-order="shuffled">
                            Shuffled
                        </button>
                        <button class="size-btn" data-order="ordered">
                            In order
                        </button>
                    </div>
                </div>
                <div class="session-size-wrap">
                    <p class="session-size-label">Direction</p>
                    <div class="session-size-options">
                        <button class="size-btn active" data-direction="forward">
                            Front → Back
                        </button>
                        <button class="size-btn" data-direction="reverse">
                            Back → Front
                        </button>
                    </div>
                </div>
                <button id="btn-start" class="btn btn-primary">Start</button>
            </div>
        </div>

        <!-- Screen: Study -->
        <div id="screen-study" class="screen">
            <div class="study-layout">
                <div class="study-header">
                    <button id="btn-back-decks" class="btn-back">
                        ← Decks
                    </button>
                    <span id="progress-text" class="progress-text">0 / 0</span>
                </div>
                <div class="progress-bar-wrap">
                    <div id="progress-bar" class="progress-bar"></div>
                </div>
                <div class="card-wrap">
                    <div
                        id="card"
                        class="card"
                        role="button"
                        tabindex="0"
                        aria-label="Flip card"
                    >
                        <div class="card-inner">
                            <div class="card-front">
                                <p id="card-front-text" class="card-text"></p>
                                <span class="card-hint">tap to reveal</span>
                            </div>
                            <div class="card-back">
                                <p id="card-back-text" class="card-text"></p>
                                <p id="card-notes-text" class="card-notes"></p>
                                <span class="card-hint">tap to flip</span>
                            </div>
                        </div>
                    </div>
                </div>
                <div id="answer-buttons" class="answer-buttons">
                    <button id="btn-miss" class="btn btn-miss">
                        Still learning
                    </button>
                    <button id="btn-know" class="btn btn-know">Know it</button>
                </div>
            </div>
        </div>

        <!-- Screen: Summary -->
        <div id="screen-summary" class="screen">
            <div class="container">
                <button id="btn-pick-deck" class="btn-back">← Decks</button>
                <h2 class="summary-title">Session complete</h2>
                <div class="summary-score-wrap">
                    <p id="summary-score-num" class="summary-score-num"></p>
                    <p class="summary-score-label">cards known</p>
                </div>
                <button id="btn-repeat" class="btn btn-primary">
                    Repeat session
                </button>
                <button id="btn-study-again" class="btn btn-secondary">
                    New session
                </button>
            </div>
        </div>

        <script src="app.js"></script>
    </body>
</html>
